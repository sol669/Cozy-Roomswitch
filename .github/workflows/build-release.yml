name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Stage a draft release after all checks pass
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: room-switcher-tray-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_VERSION: 1.0.5
  PROJECT: rebuild/src/RoomSwitcherTray.Core/RoomSwitcherTray.Core.csproj

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify version and regression tests
        run: |
          [xml]$project = Get-Content $env:PROJECT
          if ($project.Project.PropertyGroup.Version -ne $env:APP_VERSION) { throw 'Project/workflow version mismatch' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$env:APP_VERSION") { throw 'Tag/version mismatch' }
          dotnet run --project rebuild/tests/ScenarioTests -c Release
          if ($LASTEXITCODE) { throw 'Scenario tests failed' }
          dotnet run --project rebuild/tests/AudioInteropTests -c Release -- --policy-only
          if ($LASTEXITCODE) { throw 'Audio tests failed' }
          & rebuild/tests/Verify-SettingsContract.ps1
          & rebuild/tests/Verify-RuntimeContract.ps1
      - name: Publish and validate standard package
        run: |
          dotnet publish $env:PROJECT -c Release -r win-x64 --self-contained false -p:Platform=x64 -p:WindowsAppSDKSelfContained=false -o publish
          if ($LASTEXITCODE) { throw 'Standard publish failed' }
          $build = 'rebuild/src/RoomSwitcherTray.Core/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64'
          Copy-Item -LiteralPath "$build/App.xbf","$build/CozyRoomswitch.pri" -Destination publish
          Copy-Item installer/README-Portable.txt publish/README-Portable.txt
          & rebuild/tests/Verify-Package.ps1 -PublishPath publish -ExpectedVersion $env:APP_VERSION -SelfContained $false
          Compress-Archive -Path publish/* -DestinationPath Room-Switcher-Tray-Portable-win-x64.zip -CompressionLevel Optimal
      - name: Publish and validate self-contained package
        run: |
          dotnet clean $env:PROJECT -c Release -r win-x64 -p:Platform=x64
          if ($LASTEXITCODE) { throw 'Clean failed' }
          dotnet publish $env:PROJECT -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -o publish-self-contained
          if ($LASTEXITCODE) { throw 'Self-contained publish failed' }
          $build = 'rebuild/src/RoomSwitcherTray.Core/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64'
          Copy-Item -LiteralPath "$build/App.xbf","$build/CozyRoomswitch.pri" -Destination publish-self-contained
          Copy-Item installer/README-Portable.txt publish-self-contained/README-Portable.txt
          & rebuild/tests/Verify-Package.ps1 -PublishPath publish-self-contained -ExpectedVersion $env:APP_VERSION -SelfContained $true
          Compress-Archive -Path publish-self-contained/* -DestinationPath Room-Switcher-Tray-Portable-Self-Contained-win-x64.zip -CompressionLevel Optimal
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build and validate installers
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:APP_VERSION "/DPublishDir=${{ github.workspace }}\publish" installer/RoomSwitcherTray-Standard.iss
          if ($LASTEXITCODE) { throw 'Standard installer failed' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:APP_VERSION "/DPublishDir=${{ github.workspace }}\publish-self-contained" installer/RoomSwitcherTray.iss
          if ($LASTEXITCODE) { throw 'Self-contained installer failed' }
          $installers = @(Get-ChildItem release/*.exe)
          if ($installers.Count -ne 2) { throw 'Expected exactly two installers' }
          foreach ($file in $installers) {
            if ($file.VersionInfo.ProductVersion -notlike "$env:APP_VERSION*") { throw "Incorrect installer version: $($file.Name)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: RoomSwitcher-${{ env.APP_VERSION }}-four-packages
          path: |
            Room-Switcher-Tray-Portable-win-x64.zip
            Room-Switcher-Tray-Portable-Self-Contained-win-x64.zip
            release/Cozy-Roomswitch-Setup-v${{ env.APP_VERSION }}.exe
            release/Cozy-Roomswitch-Setup-Offline-v${{ env.APP_VERSION }}.exe
          if-no-files-found: error
      - name: Stage release for final verification
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          name: RoomSwitcher ${{ env.APP_VERSION }}
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: rebuild/RELEASE-1.0.5.md
          draft: true
          files: |
            Room-Switcher-Tray-Portable-win-x64.zip
            Room-Switcher-Tray-Portable-Self-Contained-win-x64.zip
            release/Cozy-Roomswitch-Setup-v${{ env.APP_VERSION }}.exe
            release/Cozy-Roomswitch-Setup-Offline-v${{ env.APP_VERSION }}.exe
          fail_on_unmatched_files: true
          overwrite_files: false
